name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 自动克隆依赖 ====================
      - name: Clone Dobby
        run: |
          cd native
          rm -rf external/dobby
          git clone https://github.com/LSPosed/Dobby.git external/dobby --depth 1

      - name: Clone LSPlant
        run: |
          cd native
          rm -rf external/lsplant
          git clone https://github.com/LSPosed/LSPlant.git external/lsplant --depth 1
      # ============================================================

      - name: Install Ninja (for C++ Modules support)
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Configure and Build with CMake (Ninja + C++ Modules)
        run: |
          cd native
          rm -rf build
          mkdir -p build

          cmake -B build \
            -G Ninja \                                           # ← 关键：使用 Ninja 生成器
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          # 使用 -j1 方便看完整错误，成功后再改回 -j$(nproc)
          cmake --build build --config Release -- -j1

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a

          SO_PATH="native/build/zygisk/arm64-v8a/libbootloader_spoofer.so"
          if [ -f "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "✓ .so 文件复制成功"
          else
            echo "❌ Error: 未找到 $SO_PATH"
            echo "当前 build 目录内容："
            find native/build -name "*.so" 2>/dev/null || echo "没有找到任何 .so 文件"
            exit 1
          fi

          # 复制 hooker.dex（如果有）
          if [ -f "template/hooker.dex" ]; then
            cp template/hooker.dex MagiskModule/hooker.dex
          fi

          cp module.prop MagiskModule/
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer
          path: MagiskModule/