name: Build Bootloader Spoofer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cmake ninja-build

      - name: Prepare LSPlant
        run: |
          # 修复 LSPlant 子模块 SSH 问题
          git config --global url."https://github.com/".insteadOf git@github.com:

          # 手动 clone LSPlant（避免拉取有问题的测试子模块）
          if [ ! -d "external/lsplant" ]; then
            git clone --depth 1 https://github.com/LSPosed/LSPlant.git external/lsplant
          fi

          # 清理不需要的目录，减少体积
          rm -rf external/lsplant/test external/lsplant/docs external/lsplant/.git || true

          # 验证头文件是否存在
          ls -la external/lsplant/lsplant/src/main/jni/include/ || echo "Warning: include dir not found"

      - name: Build module (all ABIs)
        run: |
          python3 build.py zip --force --save-debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer-Zygisk
          path: release/*.zip
          retention-days: 7

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          tag_name: ${{ github.ref_name }}
          name: Bootloader Spoofer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
