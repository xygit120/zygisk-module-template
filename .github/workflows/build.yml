name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Configure and Build with CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a
          
          # 查找编译好的 .so 文件
          SO_PATH=$(find . -path "*/arm64-v8a/*.so" -o -name "lib*.so" | head -1)
          
          if [ -n "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "Copied .so from: $SO_PATH"
          else
            echo "Error: No .so file found!"
            find . -name "*.so" | head -10
            exit 1
          fi
          
          cp module.prop MagiskModule/
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer-Zygisk
          path: MagiskModule/

      - name: Create Release Zip
        if: github.event_name != 'pull_request'
        run: |
          cd MagiskModule
          zip -r ../BootloaderSpoofer-Zygisk.zip ./*

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: BootloaderSpoofer-Zygisk.zip
          tag_name: v${{ github.run_number }}
          name: BootloaderSpoofer Zygisk Build ${{ github.run_number }}