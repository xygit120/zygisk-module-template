name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 正常拉取主仓库代码（切记：不要在这里开 submodules: recursive）
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # 2. 精确克隆稳定的依赖，并只拉取核心子模块，绕过测试目录里的死链
      - name: Clone Stable LSPlant & Dobby (Bypass Broken Test Submodules)
        working-directory: native
        run: |
          rm -rf external/dobby external/lsplant
          
          # 克隆 Dobby
          git clone https://github.com/LSPosed/Dobby.git external/dobby --depth 1
          
          # 克隆稳定版 v1.2.0 的 LSPlant (避开新版的 C++20 模块化深坑)
          git clone --branch v1.2.0 https://github.com/LSPosed/LSPlant.git external/lsplant --depth 1
          
          # 【核心魔法】只初始化核心编译依赖 dex_builder，完全不理会 test 目录下的 lsprism 等死链
          cd external/lsplant
          git submodule update --init --depth 1 lsplant/src/main/jni/external/dex_builder

      # 3. 使用最稳妥的 NDK r26d 编译
      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Configure and Build with CMake (Ninja + NDK r26d)
        working-directory: native
        run: |
          rm -rf build
          mkdir -p build
          
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a

          SO_PATH="native/build/zygisk/arm64-v8a/libbootloader_spoofer.so"
          if [ -f "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "✓ .so 文件复制成功"
          else
            echo "❌ Error: 未找到 $SO_PATH"
            echo "当前 build 目录内容："
            find native/build -name "*.so" 2>/dev/null || echo "没有找到任何 .so 文件"
            exit 1
          fi

          if [ -f "template/hooker.dex" ]; then
            cp template/hooker.dex MagiskModule/hooker.dex
          fi

          if [ -f "module.prop" ]; then
            cp module.prop MagiskModule/
          else
            echo "❌ Error: 根目录下缺少 module.prop 文件！"
            exit 1
          fi
          
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer
          path: MagiskModule/
