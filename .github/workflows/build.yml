name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 自动克隆依赖并强制降级 C++ 标准 ====================
      - name: Clone Dobby
        working-directory: native
        run: |
          rm -rf external/dobby
          git clone https://github.com/LSPosed/Dobby.git external/dobby --depth 1

      - name: Clone LSPlant
        working-directory: native
        run: |
          rm -rf external/lsplant
          git clone https://github.com/LSPosed/LSPlant.git external/lsplant --depth 1
          cd external/lsplant
          git submodule update --init --recursive --depth 1 lsplant/src/main/jni/external/dex_builder
          
          # 核心修复 1：将克隆下来的 LSPlant 内部 CMakeLists.txt 的 C++23/2b 强行降级为稳定的 C++20
          find . -name "CMakeLists.txt" -exec sed -i 's/CMAKE_CXX_STANDARD 23/CMAKE_CXX_STANDARD 20/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i 's/CMAKE_CXX_STANDARD 2b/CMAKE_CXX_STANDARD 20/g' {} +
      # ============================================================

      - name: Install Ninja (for C++ Modules support)
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Android NDK r27
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Configure and Build with CMake (Ninja + Stable C++20)
        working-directory: native
        run: |
          rm -rf build
          mkdir -p build
          
          # 核心修复 2：在全局构建参数中同样锁定 CMAKE_CXX_STANDARD 为 20
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DCMAKE_CXX_STANDARD=20 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release -- -j1

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a

          SO_PATH="native/build/zygisk/arm64-v8a/libbootloader_spoofer.so"
          if [ -f "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "✓ .so 文件复制成功"
          else
            echo "❌ Error: 未找到 $SO_PATH"
            echo "当前 build 目录内容："
            find native/build -name "*.so" 2>/dev/null || echo "没有找到任何 .so 文件"
            exit 1
          fi

          if [ -f "template/hooker.dex" ]; then
            cp template/hooker.dex MagiskModule/hooker.dex
          fi

          if [ -f "module.prop" ]; then
            cp module.prop MagiskModule/
          else
            echo "❌ Error: 根目录下缺少 module.prop 文件！"
            exit 1
          fi
          
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer
          path: MagiskModule/
