name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build Module (zip)
        run: |
          python build.py zip --ndk ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule
          
          # 模板默认会把 zip 输出到 release 目录
          if [ -d "release" ]; then
            cp release/*.zip MagiskModule/ || true
          fi
          
          # 同时复制原始文件，方便手动安装
          mkdir -p MagiskModule/zygisk/arm64-v8a
          cp module.prop MagiskModule/
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true
          
          # 尝试提取 so 文件
          find . -name "*.so" -type f | head -1 | xargs -I {} cp {} MagiskModule/zygisk/arm64-v8a/arm64-v8a.so || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer-Zygisk
          path: MagiskModule/

      - name: Create Release Zip
        if: github.event_name != 'pull_request'
        run: |
          if ls release/*.zip 1> /dev/null 2>&1; then
            cp release/*.zip BootloaderSpoofer-Zygisk.zip
          else
            cd MagiskModule
            zip -r ../BootloaderSpoofer-Zygisk.zip ./*
          fi

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: BootloaderSpoofer-Zygisk.zip
          tag_name: v${{ github.run_number }}
          name: BootloaderSpoofer Zygisk Build ${{ github.run_number }}