name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 正常拉取主仓库代码（拉下你当前提交的 LSPlant-6.4 文件夹）
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # 2. 根据你的本地目录结构进行精密适配与补齐
      - name: Sync and Fix Local LSPlant Structure
        run: |
          # 2.1 初始化 Dobby 子模块（如果它是以子模块形式存在的话）
          git submodule update --init native/external/dobby || true
          
          # 2.2 核心修正：将 LSPlant-6.4 重命名为 CMake 预期的小写 lsplant
          if [ -d "native/external/LSPlant-6.4" ]; then
            echo "✓ 发现 native/external/LSPlant-6.4，正在纠正目录名..."
            mv native/external/LSPlant-6.4 native/external/lsplant
          fi
          
          # 2.3 核心补齐：官方 Zip 包里缺失了 dex_builder，我们在此处精准克隆补齐
          DEX_BUILDER_DIR="native/external/lsplant/lsplant/src/main/jni/external/dex_builder"
          if [ ! -f "$DEX_BUILDER_DIR/CMakeLists.txt" ]; then
            echo "⚠️ 检测到 dex_builder 核心依赖缺失（Zip 源码包通病），正在手动递归补齐..."
            rm -rf "$DEX_BUILDER_DIR"
            git clone --recursive https://github.com/LSPosed/DexBuilder.git "$DEX_BUILDER_DIR"
            echo "✓ dex_builder 及其套娃依赖 parallel_hashmap 补齐成功！"
          fi

      # 3. 使用最稳妥的 NDK r26d 编译
      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Configure and Build with CMake (Ninja + NDK r26d)
        working-directory: native
        run: |
          rm -rf build
          mkdir -p build
          
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release

      # 4. 打包 Magisk 模块
      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a

          SO_PATH="native/build/zygisk/arm64-v8a/libbootloader_spoofer.so"
          if [ -f "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "✓ .so 文件复制成功"
          else
            echo "❌ Error: 未找到 $SO_PATH"
            echo "当前 build 目录内容："
            find native/build -name "*.so" 2>/dev/null || echo "没有找到任何 .so 文件"
            exit 1
          fi

          if [ -f "template/hooker.dex" ]; then
            cp template/hooker.dex MagiskModule/hooker.dex
          fi

          if [ -f "module.prop" ]; then
            cp module.prop MagiskModule/
          else
            echo "❌ Error: 根目录下缺少 module.prop 文件！"
            exit 1
          fi
          
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer
          path: MagiskModule/
