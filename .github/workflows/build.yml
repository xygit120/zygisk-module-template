name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Prepare LSPlant
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          if [ ! -d "external/lsplant" ]; then
            git clone --depth 1 https://github.com/LSPosed/LSPlant.git external/lsplant
          fi
          rm -rf external/lsplant/test external/lsplant/docs || true

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j$(nproc)

      - name: Prepare Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a
          cp build/zygisk/arm64-v8a/libbootloader_spoofer.so MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
          cp module.prop MagiskModule/
          cp customize.sh MagiskModule/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer-Zygisk
          path: MagiskModule/