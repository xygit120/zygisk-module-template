name: Build Bootloader Spoofer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Prepare Android SDK structure
        run: |
          mkdir -p $HOME/android-sdk/ndk
          ln -sfn ${{ steps.setup-ndk.outputs.ndk-path }} $HOME/android-sdk/ndk/r26d
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Prepare LSPlant
        run: |
          if [ ! -d "external/lsplant" ]; then
            git clone --depth 1 https://github.com/LSPosed/LSPlant.git external/lsplant
          fi
          rm -rf external/lsplant/test external/lsplant/docs || true

      - name: Build module
        run: python3 build.py zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer-Zygisk
          path: release/*.zip

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          tag_name: build-${{ github.run_number }}
          name: Bootloader Spoofer Build ${{ github.run_number }}