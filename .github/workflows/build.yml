name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 自动克隆依赖 ====================
      - name: Clone Dobby
        working-directory: native
        run: |
          rm -rf external/dobby
          git clone https://github.com/LSPosed/Dobby.git external/dobby --depth 1

      - name: Clone LSPlant
        working-directory: native
        run: |
          rm -rf external/lsplant
          git clone https://github.com/LSPosed/LSPlant.git external/lsplant --depth 1
          cd external/lsplant
          git submodule update --init --recursive --depth 1 lsplant/src/main/jni/external/dex_builder
      # ============================================================

      # 核心修复：安装环境并动态创建软链接，抹平 Ubuntu 版本的命名差异
      - name: Install Ninja & Clang Tools (for C++ Modules support)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tools clang
          
          # 动态寻找系统里带版本号的二进制文件（取最新版本），并软链接到 CMake 指定的通用路径
          SCAN_DEPS_BIN=$(ls /usr/bin/clang-scan-deps-* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SCAN_DEPS_BIN" ]; then
            echo "✓ 成功检测到依赖扫描器: $SCAN_DEPS_BIN"
            sudo ln -sf "$SCAN_DEPS_BIN" /usr/bin/clang-scan-deps
          else
            echo "❌ Error: 未能在系统中检测到任何版本的 clang-scan-deps！"
            exit 1
          fi

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Configure and Build with CMake (Ninja + C++ Modules)
        working-directory: native
        run: |
          rm -rf build
          mkdir -p build
          
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release -- -j1

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a

          SO_PATH="native/build/zygisk/arm64-v8a/libbootloader_spoofer.so"
          if [ -f "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "✓ .so 文件复制成功"
          else
            echo "❌ Error: 未找到 $SO_PATH"
            echo "当前 build 目录内容："
            find native/build -name "*.so" 2>/dev/null || echo "没有找到任何 .so 文件"
            exit 1
          fi

          if [ -f "template/hooker.dex" ]; then
            cp template/hooker.dex MagiskModule/hooker.dex
          fi

          if [ -f "module.prop" ]; then
            cp module.prop MagiskModule/
          else
            echo "❌ Error: 根目录下缺少 module.prop 文件！"
            exit 1
          fi
          
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer
          path: MagiskModule/
