name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 自动克隆依赖 ====================
      - name: Clone Dobby
        working-directory: native
        run: |
          rm -rf external/dobby
          git clone https://github.com/LSPosed/Dobby.git external/dobby --depth 1

      - name: Clone LSPlant
        working-directory: native
        run: |
          rm -rf external/lsplant
          git clone https://github.com/LSPosed/LSPlant.git external/lsplant --depth 1
          cd external/lsplant
          git submodule update --init --recursive --depth 1 lsplant/src/main/jni/external/dex_builder
      # ============================================================

      - name: Install Ninja & Host Clang Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tools llvm

      # 回退到兼容 LSPlant 语法的 r26d
      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      # 核心魔法：将主机的 clang-scan-deps 软链接到 NDK r26d 目录中，白嫖扫描器
      - name: Inject clang-scan-deps into NDK r26d
        run: |
          SCAN_DEPS_PATH=$(which clang-scan-deps || which clang-scan-deps-15 || which clang-scan-deps-16 || which clang-scan-deps-17 || which clang-scan-deps-18)
          echo "Found host clang-scan-deps at: $SCAN_DEPS_PATH"
          
          NDK_BIN_DIR="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK Bin Directory: $NDK_BIN_DIR"
          
          ln -sf "$SCAN_DEPS_PATH" "$NDK_BIN_DIR/clang-scan-deps"
          ls -l "$NDK_BIN_DIR/clang-scan-deps"

      - name: Configure and Build with CMake (Ninja + NDK r26d)
        working-directory: native
        run: |
          rm -rf build
          mkdir -p build
          
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a

          SO_PATH="native/build/zygisk/arm64-v8a/libbootloader_spoofer.so"
          if [ -f "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "✓ .so 文件复制成功"
          else
            echo "❌ Error: 未找到 $SO_PATH"
            echo "当前 build 目录内容："
            find native/build -name "*.so" 2>/dev/null || echo "没有找到任何 .so 文件"
            exit 1
          fi

          if [ -f "template/hooker.dex" ]; then
            cp template/hooker.dex MagiskModule/hooker.dex
          fi

          if [ -f "module.prop" ]; then
            cp module.prop MagiskModule/
          else
            echo "❌ Error: 根目录下缺少 module.prop 文件！"
            exit 1
          fi
          
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer
          path: MagiskModule/
