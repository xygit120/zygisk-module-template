name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 自动克隆依赖 ====================
      - name: Clone Dobby
        working-directory: native
        run: |
          rm -rf external/dobby
          git clone https://github.com/LSPosed/Dobby.git external/dobby --depth 1

      - name: Clone LSPlant
        working-directory: native
        run: |
          rm -rf external/lsplant
          git clone https://github.com/LSPosed/LSPlant.git external/lsplant --depth 1
          cd external/lsplant
          git submodule update --init --recursive --depth 1 lsplant/src/main/jni/external/dex_builder
      # ============================================================

      # 删除了所有杂乱的 clang-tools 安装，只保留纯净的 ninja-build
      - name: Install Ninja (for C++ Modules support)
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # 核心变动：直接升级到自带 C++20 模块全家桶工具链的 NDK r27
      - name: Setup Android NDK r27
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Configure and Build with CMake (Ninja + Auto C++ Modules)
        working-directory: native
        run: |
          rm -rf build
          mkdir -p build
          
          # 删除了硬编码的 CMAKE_CXX_COMPILER_CLANG_SCAN_DEPS 路径
          # CMake 会在 NDK r27 内部自动搜寻并配对最完美的依赖扫描器
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release -- -j1

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a

          SO_PATH="native/build/zygisk/arm64-v8a/libbootloader_spoofer.so"
          if [ -f "$SO_PATH" ]; then
            cp "$SO_PATH" MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
            echo "✓ .so 文件复制成功"
          else
            echo "❌ Error: 未找到 $SO_PATH"
            echo "当前 build 目录内容："
            find native/build -name "*.so" 2>/dev/null || echo "没有找到任何 .so 文件"
            exit 1
          fi

          if [ -f "template/hooker.dex" ]; then
            cp template/hooker.dex MagiskModule/hooker.dex
          fi

          if [ -f "module.prop" ]; then
            cp module.prop MagiskModule/
          else
            echo "❌ Error: 根目录下缺少 module.prop 文件！"
            exit 1
          fi
          
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer
          path: MagiskModule/
