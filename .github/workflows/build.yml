name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build module
        run: python3 build.py zip

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: out/*.zip
