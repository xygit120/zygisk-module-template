name: Build Magisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Python
        run: sudo apt-get install -y python3

      - name: Build Release
        run: |
          python3 build.py build -t release --ndk ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Prepare Magisk Module
        run: |
          mkdir -p MagiskModule/zygisk/arm64-v8a
          
          # 尝试几种可能的 so 文件位置
          if [ -f "libs/arm64-v8a.so" ]; then
            cp libs/arm64-v8a.so MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
          elif [ -f "build/libs/arm64-v8a.so" ]; then
            cp build/libs/arm64-v8a.so MagiskModule/zygisk/arm64-v8a/arm64-v8a.so
          else
            # 兜底查找
            find . -name "*.so" -type f | head -3 | xargs -I {} cp {} MagiskModule/zygisk/arm64-v8a/arm64-v8a.so || true
          fi
          
          cp module.prop MagiskModule/
          [ -f customize.sh ] && cp customize.sh MagiskModule/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootloaderSpoofer-Zygisk
          path: MagiskModule/

      - name: Create Release Zip
        if: github.event_name != 'pull_request'
        run: |
          cd MagiskModule
          zip -r ../BootloaderSpoofer-Zygisk.zip ./*

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: BootloaderSpoofer-Zygisk.zip
          tag_name: v${{ github.run_number }}
          name: BootloaderSpoofer Zygisk ${{ github.run_number }}